updates:
  - cooldown:
      default-days: 7
    directory: '/'
    groups:
      development:
        dependency-type: 'development'
      production:
        dependency-type: 'production'
    ignore:
      - dependency-name: 'typescript'
        versions:
          - '>=7'
    package-ecosystem: 'npm'
    schedule:
      interval: 'weekly'
  - cooldown:
      default-days: 7
    directory: '/'
    groups:
      github-actions:
        patterns:
          - '*'
    package-ecosystem: 'github-actions'
    schedule:
      interval: 'weekly'
version: 2
